name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile (warnings as errors)
        run: javac --release 17 -Xlint:all -Werror -d out $(find src test -name "*.java")
      - name: Test
        run: java -Djava.awt.headless=true -cp out com.risny.brickbreaker.GameTests
